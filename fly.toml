# fly.toml app configuration file generated for customer-management-api-shy-surf-8080 on 2025-12-17T18:02:17+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'customer-management-api-shy-surf-8080'
primary_region = 'iad'

[build]
  dockerfile = 'customer.management.api/Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ASPNETCORE_URLS = 'http://+:8080'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  ipv6 = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1  # Keep at least 1 machine running to avoid race conditions
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'  # Increased grace period for machine startup
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
